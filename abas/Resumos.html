<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="css/style_resumos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Central - Resumos de Sessões</title>
</head>
<body>
    <div class="cabecalho">
        <header>
            <div class="logo">
                <a href="../index.html"><img src="../RPG.png" alt="RPG Central Logo"></a>
            </div>
            <div class="botoes__menu">
                <ul>
                    <li>
                        <a href="Sistemas.html">Sistemas</a>
                        <a href="Campanhas.html">Campanhas</a>
                        <a href="Personagens.html">Personagens</a>
                        <a href="Resumos.html" class="active">Resumos</a>
                    </li>
                </ul>
            </div>
            <div class="login__registro">
                <button class="entrar"><a href="Entrar.html">Entrar</a></button>
                <button class="registrar"><a href="Registrar.html">Registrar</a></button>
            </div>
        </header>
    </div>

    <main class="resumos-container">
        <div class="resumos-topo">
            <div>
                <h2 style="font-size: 28px; color: white;">Crônicas & <span style="color: #80D0FF;">Resumos de Sessões</span></h2>
                <p style="color: #c3eeff; font-size: 15px; margin-top: 4px;">Guarde a memória das grandes façanhas e momentos marcantes de cada jogo</p>
            </div>
            <button class="btn-novo-resumo" id="btn-novo-resumo">+ Novo Resumo de Sessão</button>
        </div>

        <!-- Filtro por Campanha -->
        <div id="container-filtro-campanha" style="margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; background: rgba(0, 20, 40, 0.6); padding: 15px 20px; border-radius: 12px; border: 1px solid rgba(0, 72, 135, 0.5);">
            <div style="display: flex; align-items: center; gap: 12px;">
                <label for="filtro-campanha-select" style="color: #80D0FF; font-weight: 600; font-size: 14.5px;">🏰 Filtrar por Campanha:</label>
                <select id="filtro-campanha-select" style="padding: 8px 14px; background: #061523; border: 1px solid #004887; border-radius: 8px; color: white; font-size: 14px; min-width: 240px;">
                    <option value="todas">Todas as Campanhas</option>
                </select>
            </div>
            <div id="tag-filtro-ativo" style="display: none; align-items: center; gap: 10px;">
                <span id="texto-filtro-ativo" style="font-size: 13px; color: #cbd5e1;"></span>
                <button onclick="limparFiltroCampanha()" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;">Limpar Filtro</button>
            </div>
        </div>

        <div id="lista-resumos">
            <!-- Preenchido via JavaScript -->
        </div>
    </main>

    <!-- Modal Novo Resumo -->
    <div id="modal-novo-resumo" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 15, 30, 0.85); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: linear-gradient(135deg, rgb(25, 28, 29) 0%, rgba(0, 49, 87, 0.98) 100%); border: 1px solid #80D0FF; border-radius: 16px; max-width: 650px; width: 100%; padding: 30px; color: white; position: relative;">
            <button onclick="fecharModalNovoResumo()" style="position: absolute; top: 15px; right: 18px; background: transparent; border: none; color: #80D0FF; font-size: 26px; cursor: pointer;">&times;</button>
            <h2 style="color: #80D0FF; margin-bottom: 20px;">+ Registrar Novo Resumo de Sessão</h2>
            <form onsubmit="salvarNovoResumo(event)">
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Campanha *</label>
                    <select id="resumo-camp-id" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                        <!-- Preenchido via JS -->
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin-bottom: 14px;">
                    <div>
                        <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Nº do Episódio *</label>
                        <input type="number" id="resumo-episodio" placeholder="Insira o número" value="1" min="1" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Data do Jogo *</label>
                        <input type="text" id="resumo-data" placeholder="Insira a data (dd/mm/aaaa)" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                    </div>
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Título do Episódio *</label>
                    <input type="text" id="resumo-titulo" placeholder="Insira o título do episódio" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Resumo dos Acontecimentos *</label>
                    <textarea id="resumo-texto" rows="5" placeholder="Insira o resumo e acontecimentos da sessão..." required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;"></textarea>
                </div>
                <button type="submit" style="width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">Salvar Resumo</button>
            </form>
        </div>
    </div>

    <!-- Modal Editar Resumo -->
    <div id="modal-editar-resumo" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 15, 30, 0.85); backdrop-filter: blur(8px); z-index: 10000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: linear-gradient(135deg, rgb(25, 28, 29) 0%, rgba(0, 49, 87, 0.98) 100%); border: 1px solid #80D0FF; border-radius: 16px; max-width: 650px; width: 100%; padding: 30px; color: white; position: relative;">
            <button onclick="fecharModalEditarResumo()" style="position: absolute; top: 15px; right: 18px; background: transparent; border: none; color: #80D0FF; font-size: 26px; cursor: pointer;">&times;</button>
            <h2 style="color: #80D0FF; margin-bottom: 20px;">✏️ Editar Resumo de Sessão</h2>
            <form onsubmit="salvarEdicaoResumo(event)">
                <input type="hidden" id="edit-resumo-id">
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Campanha *</label>
                    <select id="edit-resumo-camp-id" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin-bottom: 14px;">
                    <div>
                        <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Nº do Episódio *</label>
                        <input type="number" id="edit-resumo-episodio" min="1" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Data do Jogo *</label>
                        <input type="text" id="edit-resumo-data" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                    </div>
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Título do Episódio *</label>
                    <input type="text" id="edit-resumo-titulo" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; color: #80D0FF; margin-bottom: 5px;">Resumo dos Acontecimentos *</label>
                    <textarea id="edit-resumo-texto" rows="5" required style="width: 100%; padding: 10px; background: rgba(0,20,40,0.9); border: 1px solid #004887; border-radius: 8px; color: white;"></textarea>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button type="submit" style="flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">Salvar Alterações</button>
                    <button type="button" onclick="fecharModalEditarResumo()" style="padding: 12px 20px; background: #334155; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/resumos.js"></script>
</body>
</html>
