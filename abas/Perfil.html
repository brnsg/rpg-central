<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="css/style_perfil.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Central - Meu Perfil</title>
</head>
<body>
    <div class="cabecalho">
        <header>
            <div class="logo">
                <a href="../index.html"><img src="../RPG.png" alt="RPG Central Logo"></a>
            </div>
            <div class="botoes__menu">
                <ul>
                    <li>
                        <a href="Sistemas.html">Sistemas</a>
                        <a href="Campanhas.html">Campanhas</a>
                        <a href="Personagens.html">Personagens</a>
                        <a href="Resumos.html">Resumos</a>
                    </li>
                </ul>
            </div>
            <div class="login__registro">
                <button class="entrar"><a href="Entrar.html">Entrar</a></button>
                <button class="registrar"><a href="Registrar.html">Registrar</a></button>
            </div>
        </header>
    </div>

    <main class="perfil-container">
        <div class="perfil-card">
            <div class="perfil-topo">
                <img id="perfil-avatar-img" class="perfil-avatar-preview" src="../avatar_padrao.svg" alt="Avatar">
                <div>
                    <h2 style="font-size: 24px; color: white;">Editar Perfil e Conta</h2>
                    <p style="color: #cbd5e1; font-size: 14px; margin-top: 4px;">Atualize suas informações pessoais, foto de perfil e credenciais</p>
                    <div style="margin-top: 10px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                        <span style="font-size: 13px; color: #ffd700; font-weight: bold;">
                            🪙 <span id="perfil-saldo-txt">0.00</span> Moedas
                        </span>
                        <span style="font-size: 12px; color: #80D0FF; background: rgba(0, 48, 92, 0.6); padding: 3px 8px; border-radius: 6px;">
                            ID: <span id="perfil-uuid-txt">...</span>
                        </span>
                    </div>
                </div>
            </div>

            <form id="form-editar-perfil">
                <div class="perfil-form-grupo">
                    <label for="perfil-nome">Nome de Usuário *</label>
                    <input type="text" id="perfil-nome" placeholder="Insira seu nome de usuário" required>
                </div>

                <div class="perfil-form-grupo">
                    <label for="perfil-email">E-mail Cadastrado (Não editável)</label>
                    <input type="email" id="perfil-email" disabled>
                </div>

                <div class="perfil-form-grupo">
                    <label for="perfil-cidade">Cidade *</label>
                    <input type="text" id="perfil-cidade" placeholder="Insira sua cidade" required>
                </div>

                <div class="perfil-form-grupo">
                    <label for="perfil-foto">URL da Foto de Perfil (Opcional)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="url" id="perfil-foto" placeholder="Insira a URL da foto de perfil" style="flex: 1;">
                        <button type="button" onclick="redefinirFotoPadrao()" style="padding: 0 14px; background: rgba(0, 48, 92, 0.8); border: 1px solid #004887; color: #80D0FF; border-radius: 8px; cursor: pointer; font-size: 13px;">Usar Padrão</button>
                    </div>
                </div>

                <div class="perfil-form-grupo">
                    <label for="perfil-nova-senha">Alterar Senha (Opcional)</label>
                    <input type="password" id="perfil-nova-senha" placeholder="Insira nova senha se desejar alterar (mínimo 6 caracteres)">
                </div>

                <button type="submit" class="btn-salvar-perfil">Salvar Alterações</button>
            </form>

            <div class="perfil-danger-zone">
                <h4 style="color: #ef4444; font-size: 16px; margin-bottom: 8px;">Zona de Perigo</h4>
                <p style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">Ao excluir sua conta, todos os seus dados e fichas de personagens serão permanentemente removidos.</p>
                <button type="button" id="btn-deletar-conta" class="btn-deletar-conta">Excluir Minha Conta Definitivamente</button>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
